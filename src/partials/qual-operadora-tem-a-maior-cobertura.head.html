<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Qual operadora tem a maior cobertura no Brasil?", "acceptedAnswer": {"@type": "Answer", "text": "Não existe uma resposta que valha para todo lugar. A cobertura muda de cidade para cidade e até de bairro para bairro: uma operadora pode ter o melhor sinal numa região e não na outra. A pergunta que resolve é: qual operadora tem bom sinal no seu endereço, no trabalho e nos lugares onde você passa o dia. Para isso, consulte o mapa de cobertura por endereço antes de contratar."}}, {"@type": "Question", "name": "Operadora virtual tem cobertura menor?", "acceptedAnswer": {"@type": "Answer", "text": "Não necessariamente. A operadora virtual usa a rede de antenas de uma operadora parceira. Onde essa rede tem sinal, a linha da operadora virtual também tem. A i9c usa a rede de uma parceira de alcance nacional, com 5G onde houver cobertura."}}, {"@type": "Question", "name": "Como saber se pega bem na minha casa?", "acceptedAnswer": {"@type": "Answer", "text": "Procure o seu endereço no mapa de cobertura da operadora e veja a tecnologia disponível (5G, 4G, 3G ou 2G). Depois, pergunte a vizinhos ou colegas que usam a mesma rede. Dentro de casa o sinal pode ser mais fraco que na rua por causa de paredes, subsolos e distância da antena."}}, {"@type": "Question", "name": "O 5G funciona em todo lugar?", "acceptedAnswer": {"@type": "Answer", "text": "Não. O 5G funciona onde houver cobertura 5G e com um aparelho compatível. Fora dessas áreas, o celular usa 4G, 3G ou 2G, conforme o que estiver disponível no local."}}, {"@type": "Question", "name": "Se o sinal não for bom, perco meu número trocando de operadora?", "acceptedAnswer": {"@type": "Answer", "text": "Não. Pela portabilidade, o número continua seu. E se você quiser testar a rede antes de trazer o número, dá para começar com um chip pré-pago novo e decidir depois."}}, {"@type": "Question", "name": "A i9c tem cobertura na minha cidade?", "acceptedAnswer": {"@type": "Answer", "text": "Confira no mapa de cobertura da i9c, buscando pela sua cidade ou endereço. Se a sua região ainda não aparecer, fale com a gente: registramos o interesse e avisamos quando chegar."}}]}</script>
