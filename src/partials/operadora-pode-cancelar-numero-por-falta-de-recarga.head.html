<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "A operadora pode cancelar meu número por falta de recarga?", "acceptedAnswer": {"@type": "Answer", "text": "Pode, mas não de uma hora para outra. Pelas regras da Anatel, quando os créditos vencem e você não recarrega, a linha primeiro fica só recebendo ligações, depois é suspensa e só então o contrato pode ser cancelado. Recarregando antes disso, a linha volta ao normal e o número continua seu."}}, {"@type": "Question", "name": "Quanto tempo depois de acabar o crédito a linha é cancelada?", "acceptedAnswer": {"@type": "Answer", "text": "O regulamento da Anatel prevê etapas com prazo mínimo: pelo menos 30 dias com a linha só recebendo chamadas depois que os créditos vencem, e mais pelo menos 30 dias de suspensão total antes do cancelamento. A operadora pode dar prazos maiores, nunca menores."}}, {"@type": "Question", "name": "Sem crédito eu ainda recebo ligações?", "acceptedAnswer": {"@type": "Answer", "text": "Sim, na primeira etapa. Depois que os créditos vencem, a linha continua recebendo ligações por pelo menos 30 dias. Você não consegue ligar nem usar a internet, mas ainda pode ser encontrado."}}, {"@type": "Question", "name": "Se eu recarregar, recupero o saldo que venceu?", "acceptedAnswer": {"@type": "Answer", "text": "Pelas regras da Anatel, os créditos que sobraram e venceram voltam a valer quando você faz uma nova recarga antes de o contrato ser cancelado. Por isso vale recarregar assim que perceber que a linha está restrita."}}, {"@type": "Question", "name": "Perdi o número por falta de recarga. Consigo de volta?", "acceptedAnswer": {"@type": "Answer", "text": "Depois do cancelamento, o número volta para a operadora e pode ser entregue a outra pessoa no futuro. Não há garantia de recuperar. Se isso aconteceu há pouco tempo, fale com o atendimento o quanto antes para saber se ainda é possível."}}, {"@type": "Question", "name": "Como evitar perder o número no pré-pago?", "acceptedAnswer": {"@type": "Answer", "text": "Recarregue antes de os créditos vencerem. Na i9c, a recarga é feita pela área do cliente em app.i9c.net.br. Se você usa pouco a linha, compare com um plano controle, que renova todo mês e não depende de lembrar da recarga."}}]}</script>
