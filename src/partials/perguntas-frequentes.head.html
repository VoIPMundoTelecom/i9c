<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "O que é a i9c?", "acceptedAnswer": {"@type": "Answer", "text": "A i9c é uma operadora de telefonia móvel (SMP) autorizada pela ANATEL, marca do Grupo IVM Tecnologia. Oferecemos planos pré-pago, controle, família e empresas com 5G nacional, ligações ilimitadas e sem fidelidade — tudo contratável online, sem fila e sem burocracia."}}, {"@type": "Question", "name": "A i9c tem fidelidade ou multa escondida?", "acceptedAnswer": {"@type": "Answer", "text": "Não. Nenhum plano i9c tem fidelidade contratual nem multa por cancelamento. Você fica porque quer."}}, {"@type": "Question", "name": "A i9c é uma operadora de verdade?", "acceptedAnswer": {"@type": "Answer", "text": "Sim. A i9c é uma operadora móvel autorizada pela ANATEL no regime SMP, operando com infraestrutura de rede de alta capacidade via parceria MVNO. Na prática, você tem sinal de operadora grande com atendimento direto."}}, {"@type": "Question", "name": "A i9c funciona em todo o Brasil?", "acceptedAnswer": {"@type": "Answer", "text": "A cobertura é nacional para voz e dados, com 5G nas principais regiões e 4G/voz no restante. A tecnologia exata varia por cidade — consulte pelo seu CEP no mapa de cobertura."}}, {"@type": "Question", "name": "A i9c tem 5G?", "acceptedAnswer": {"@type": "Answer", "text": "Sim, com 5G ativo em diversas capitais e regiões metropolitanas, além de 4G de alcance nacional. Use a consulta por CEP para ver o que está disponível no seu endereço."}}, {"@type": "Question", "name": "Tem roaming nacional?", "acceptedAnswer": {"@type": "Answer", "text": "Sim. Os planos incluem roaming nacional sem custo adicional — você usa sua franquia viajando pelo país normalmente."}}, {"@type": "Question", "name": "Como recebo e ativo meu chip?", "acceptedAnswer": {"@type": "Answer", "text": "Após a contratação, o chip é enviado para seu endereço. A ativação é feita online seguindo as instruções que acompanham o chip, ou com a ajuda do nosso atendimento pelo 0800 800 0900."}}, {"@type": "Question", "name": "Preciso configurar a internet (APN)?", "acceptedAnswer": {"@type": "Answer", "text": "Na maioria dos aparelhos a configuração é automática. Se precisar, o passo a passo do APN é simples e nosso atendimento orienta pelo WhatsApp ou telefone."}}, {"@type": "Question", "name": "A i9c tem eSIM?", "acceptedAnswer": {"@type": "Answer", "text": "A disponibilidade de eSIM depende do plano e do aparelho. Fale com o atendimento pelo 0800 800 0900 para confirmar a opção para o seu caso."}}, {"@type": "Question", "name": "Perdi ou roubaram meu celular. E o chip?", "acceptedAnswer": {"@type": "Answer", "text": "Entre em contato imediatamente pelo 0800 800 0900 para bloquear sua linha e solicitar a segunda via do chip, mantendo o seu número."}}, {"@type": "Question", "name": "Como faço a portabilidade?", "acceptedAnswer": {"@type": "Answer", "text": "Preencha a solicitação na página de portabilidade com seus dados e o número que deseja trazer. A gente cuida da troca com a sua operadora atual; em geral a linha fica ativa na i9c em até 24h úteis."}}, {"@type": "Question", "name": "Vou ficar sem sinal durante a portabilidade?", "acceptedAnswer": {"@type": "Answer", "text": "Não. Você continua usando sua linha atual normalmente. A migração para a i9c só é concluída no momento da ativação, com interrupção mínima."}}, {"@type": "Question", "name": "Posso manter o mesmo número de outra operadora?", "acceptedAnswer": {"@type": "Answer", "text": "Sim, esse é o objetivo da portabilidade: você troca de operadora e mantém o seu número de sempre, sem perder seus contatos."}}, {"@type": "Question", "name": "Quais são os planos e a partir de quanto?", "acceptedAnswer": {"@type": "Answer", "text": "Temos pré-pago a partir de R$ 13,99, controle, Black individual, família e empresas. Todos com 5G e sem fidelidade. Veja a tabela completa na seção de planos."}}, {"@type": "Question", "name": "Quais as formas de pagamento?", "acceptedAnswer": {"@type": "Answer", "text": "Aceitamos Boleto e Pix. Após a franquia de dados, a velocidade é reduzida conforme o plano, sem cobrança surpresa."}}, {"@type": "Question", "name": "Como faço recarga?", "acceptedAnswer": {"@type": "Answer", "text": "Pela sua área do cliente em app.i9c.net.br: abra o menu Recargas, informe o número, confirme o código enviado por SMS e pague o boleto gerado. O crédito entra na linha após a compensação."}}, {"@type": "Question", "name": "A operadora pode cancelar meu número por falta de recarga?", "acceptedAnswer": {"@type": "Answer", "text": "Pode, mas não de uma hora para outra. Pelas regras da Anatel, quando os créditos vencem e você não recarrega, a linha primeiro fica só recebendo ligações, depois é suspensa e só então o contrato pode ser cancelado. Recarregando antes disso, o número continua seu. Veja os prazos em i9c.net.br/operadora-pode-cancelar-numero-por-falta-de-recarga.html."}},{"@type": "Question", "name": "Como acompanho meu consumo?", "acceptedAnswer": {"@type": "Answer", "text": "Pela sua área logada em app.i9c.net.br, onde você vê consumo de dados, status da linha e detalhes do plano."}}, {"@type": "Question", "name": "Como falo com um atendente de verdade?", "acceptedAnswer": {"@type": "Answer", "text": "Pelo 0800 800 0900 (ligação e WhatsApp gratuitos) ou pelo botão de WhatsApp aqui no site. Atendimento direto, sem labirinto de menus."}}]}</script>
