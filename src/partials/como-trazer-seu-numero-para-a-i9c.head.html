<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "A portabilidade de número pré-pago é paga?", "acceptedAnswer": {"@type": "Answer", "text": "Não. Trazer seu número para a i9c é gratuito, seja pré-pago, controle ou pós-pago."}}, {"@type": "Question", "name": "Meus créditos do pré-pago vêm junto?", "acceptedAnswer": {"@type": "Answer", "text": "Não. O saldo fica na operadora antiga e não é transferido. Use os créditos antes da data da troca e faça a primeira recarga na i9c pela área do cliente."}}, {"@type": "Question", "name": "Vou ficar sem celular durante a portabilidade?", "acceptedAnswer": {"@type": "Answer", "text": "Não. Você usa a linha atual normalmente até o dia da troca. Na hora em que o número muda de rede pode haver alguns minutos sem sinal; depois é só colocar o chip i9c."}}, {"@type": "Question", "name": "Posso trazer um número que não está no meu nome?", "acceptedAnswer": {"@type": "Answer", "text": "Só o titular pode pedir. Se a linha está no nome de outra pessoa, faça antes a troca de titularidade ou atualize o cadastro na operadora atual."}}, {"@type": "Question", "name": "A operadora pode cancelar o número por falta de recarga?", "acceptedAnswer": {"@type": "Answer", "text": "Pode, mas não de uma hora para outra. Pelas normas da Anatel para o pré-pago, quando os créditos vencem sem nova recarga, a linha passa por etapas: primeiro fica só recebendo ligações, depois é suspensa e, se continuar sem recarga, o contrato pode ser encerrado e o número deixa de ser seu. Por isso, se a sua linha atual está sem crédito há muito tempo, faça uma recarga antes de pedir a portabilidade. Na i9c, os prazos são os da Anatel: pelo menos 30 dias só recebendo ligações e mais 30 dias com a linha suspensa antes de o número poder ser cancelado."}}]}</script>
